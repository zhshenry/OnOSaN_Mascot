<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>桌面圆环伙伴 · OnOSaN_Mascot</title>
    <link rel="stylesheet" href="../preview.css">
    <link rel="stylesheet" href="motion.css">
    <script src="../preview.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="page-width topbar-inner">
        <span class="wordmark"><img src="../voice-status/mascot.svg" alt="">OnOSaN_Mascot</span>
        <nav aria-label="案例">
          <a href="../voice-status/preview.html">录音反馈</a>
          <a href="../bot-activity/preview.html">Bot 工作状态</a>
          <a href="preview.html" aria-current="page">桌面圆环伙伴</a>
        </nav>
      </div>
    </header>

    <main class="page-width preview-main" data-preview>
      <div class="preview-heading">
        <h1>桌面圆环伙伴</h1>
        <p>圆环可以在陪伴时眨眼。点击带未读角标的圆环，试一下待办助手入口。</p>
      </div>
      <div class="preview-layout">
        <div class="specimen preview-stage island-companion" data-stage data-theme="dark" data-state="quiet" style="--mascot-size: 46px">
          <details class="assistant-entry">
            <summary>
              <span class="visually-hidden">待办助手，2 条未读提醒</span>
              <svg class="mascot-shape" viewBox="0 0 46 46" aria-hidden="true">
                <circle cx="23" cy="23" r="21.5" fill="#090a0c" stroke="#76aeff" stroke-width="3"/>
                <path d="M38.2 38.2A21.5 21.5 0 0 1 7.8 38.2" fill="none" stroke="#b79aff" stroke-width="3"/>
                <g class="mascot-eyes" fill="#f5f6f8">
                  <rect x="16.5" y="19" width="4" height="8" rx="2"/>
                  <rect x="25.5" y="19" width="4" height="8" rx="2"/>
                </g>
              </svg>
              <span class="unread" aria-hidden="true">2</span>
            </summary>
            <div class="assistant-message">
              <strong>待办助手</strong>
              <p>2 条未读提醒</p>
            </div>
          </details>
          <p class="state-label" role="status" data-status>安静陪伴</p>
        </div>

        <div class="preview-options">
          <fieldset>
            <legend>伙伴状态</legend>
            <div class="state-buttons">
              <button type="button" data-next-state="quiet" data-status="安静陪伴" aria-pressed="true">静止</button>
              <button type="button" data-next-state="companion" data-status="允许眨眼" aria-pressed="false">允许眨眼</button>
            </div>
          </fieldset>
          <div class="settings">
            <label>尺寸 <select data-size><option value="20">20 px</option><option value="46" selected>46 px</option><option value="96">96 px</option></select></label>
            <label>底色 <select data-theme-option><option value="light">浅色</option><option value="dark" selected>深色</option></select></label>
            <label class="motion-check"><input type="checkbox" data-reduce-motion> 减少动态效果</label>
          </div>
          <div class="reference-links">
            <a href="mascot.svg" download>下载 SVG</a>
            <a href="reference.png">原入口设计</a>
            <a href="README.md">接入说明</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
